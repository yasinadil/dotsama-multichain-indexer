manifestVersion: subsquid.io/v0.1
name: dotsama-multichain-indexer
version: 1
description: 'Indexes Dotsama NFT Marketplace trades, royalties and cancellations on Astar and Moonbeam'
build: 
deploy:
  addons:
    postgres: 
  processor:
    - name: moonbeam-processor
      cmd: [ "sqd", "process:prod:moonbeam" ]
      env:
        RPC_ENDPOINT_MOONBEAM: ${{ secrets.RPC_ENDPOINT_MOONBEAM }}
    - name: astar-processor
      cmd: [ "sqd", "process:prod:astar" ]
      env:
        RPC_ENDPOINT_ASTAR: ${{ secrets.RPC_ENDPOINT_ASTAR }}
  api:
    cmd: [ "sqd", "serve:prod" ]
